apiVersion: scaffolder.backstage.io/v1beta2
kind: Template

metadata:
  name: study-template
  title: Test action template
  description: scaffolder vibeta2 
  annotations:
    backstage.io/time-saved:PAT4H
spec:
  owner: user:guest
  type: service

  parameters: 
    - title: Fill in some steps
      required:
        - name
      
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component
          ui:autofocus: true
          ui:options: 
            rows: 5
          
          pattern: '^([a-zA-Z][a-zA-Z0-9]*)(-[a-zA-Z0-9]+)*$'
        environment:
          title: Environment
          type: string
          description: The environment where this component will be deployed
          enum:
            - dev
            - prod

    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl: 
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options: 
            allowedHosts:
              - github.com

steps:
  - id: fetch-base
    name: Fetch Base
    action: fetch:template
    input:
      url: ./template
    values:
      name: '{{parameters.name}}'
      
  - id: publish
    name: Publish
    action: publish:github
    input:      
      description: This is ${{ parameters.name }}
      repoUrl: ${{ parameters.repoUrl }}
  
  - id: register
    name: Register
    action: catalog:register
    input:
      repoContentsUrl: {{steps['publish'].output.repoContentsUrl  }}
      catalogInfoPath: "/catalog-info.yaml"

output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
